<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Граф стратегии Star Building</title><style>
:root{--bg:#06111f;--panel:#0d1b2a;--ink:#e5eef8;--muted:#8aa2b8;--line:#27445d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#12304a,#06111f 55%);color:var(--ink);font:14px Arial,sans-serif;overflow:hidden}

button{cursor:pointer}#stage{height:calc(100vh - 82px);display:grid;grid-template-columns:1fr 310px}#canvas{position:relative;overflow:hidden}svg{width:100%;height:100%;cursor:grab}svg:active{cursor:grabbing}
#detail{border-left:1px solid var(--line);padding:18px;background:#091827;overflow:auto}#detail h2{font-size:18px;margin-top:0}#detail .tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#17344b;color:#b9d7ee;margin:3px 4px 3px 0;font-size:11px}

.edge{stroke:#46677f;stroke-width:1.1;opacity:.52}.node circle{stroke:#dbeafe;stroke-width:1;cursor:pointer;filter:drop-shadow(0 4px 6px #0008)}.node text{fill:#f8fafc;font-size:10px;pointer-events:none;text-anchor:middle}.node.selected circle{stroke:#fff;stroke-width:4}.edge.active{stroke:#fbbf24;stroke-width:3;opacity:1}
.toolbar{display:flex;gap:8px;align-items:center;flex:1}#search{width:240px}.stats{margin-left:auto;color:#9ec2dc;font-size:12px}

</style></head><body>
<header><div><h1>Граф стратегии Star Building</h1><div class="sub">Продажи · производство · маркетинг · ИИ · Астана · B2G</div></div>
<div class="toolbar"><input id="search" placeholder="Поиск узла"><select id="group"><option value="">Все контуры</option></select><button id="reset">Сбросить</button></div><div class="stats" id="stats"></div></header>
<div id="stage"><div id="canvas"><svg id="svg"><g id="world"><g id="edges"></g><g id="nodes"></g></g></svg></div>
<aside id="detail"><h2>Управляемые 500 т/мес</h2><p>Выберите узел, чтобы увидеть его роль и связи.</p><div class="legend" id="legend"></div><hr style="border-color:#27445d"><p class="sub">Граф автономный: все данные встроены в файл. Колесо — масштаб, перетаскивание — перемещение.</p></aside></div>
<script>
const DATA={"meta": {"title": "Стратегия коммерческого отдела и маркетинга Star Building", "version": "1.0", "status": "Рабочая версия", "horizon": "2026–2027"}, "nodes": [{"id": "goal", "label": "Управляемые 500 т/мес", "type": "goal", "group": "Цель", "description": "Продать, произвести, отгрузить и получить оплату без кризиса качества и сроков."}, {"id": "annual", "label": "6000 т/год", "type": "kpi", "group": "Цель"}, {"id": "baseline", "label": "Около 1000 т за 2025", "type": "fact", "group": "Исходные данные"}, {"id": "contracts", "label": "600 т договоров без графика", "type": "risk", "group": "Исходные данные"}, {"id": "avgdeal", "label": "Заказ 50–60 т", "type": "fact", "group": "Исходные данные"}, {"id": "cycle", "label": "Цикл сделки 2–3 месяца", "type": "fact", "group": "Исходные данные"}, {"id": "equipment", "label": "Оборудование имеется", "type": "fact", "group": "Производство"}, {"id": "constraint", "label": "Мощность не стабилизирована", "type": "risk", "group": "Производство"}, {"id": "audit", "label": "10-дневный аудит мощности", "type": "action", "group": "Производство"}, {"id": "slots", "label": "Производственные слоты", "type": "process", "group": "Производство"}, {"id": "ramp1", "label": "150–200 т/мес", "type": "milestone", "group": "Производство"}, {"id": "ramp2", "label": "250–300 т/мес", "type": "milestone", "group": "Производство"}, {"id": "ramp3", "label": "350–400 т/мес", "type": "milestone", "group": "Производство"}, {"id": "ramp4", "label": "450–500 т/мес", "type": "milestone", "group": "Производство"}, {"id": "staffprod", "label": "Персонал и сменность", "type": "resource", "group": "Производство"}, {"id": "wc", "label": "Оборотный капитал", "type": "resource", "group": "Производство"}, {"id": "committee", "label": "Коммерческо-производственный комитет", "type": "governance", "group": "Управление"}, {"id": "cco", "label": "Коммерческий директор", "type": "role", "group": "Команда"}, {"id": "rop", "label": "РОП", "type": "role", "group": "Команда"}, {"id": "lead", "label": "Ведущий менеджер", "type": "role", "group": "Команда"}, {"id": "astana_coord", "label": "Координатор Астаны", "type": "role", "group": "Команда"}, {"id": "tender", "label": "Менеджер по тендерам", "type": "role", "group": "Команда"}, {"id": "newmgr", "label": "Новый B2B-менеджер", "type": "hire", "group": "Команда"}, {"id": "owner", "label": "Собственник — спонсор ключевых сделок", "type": "role", "group": "Команда"}, {"id": "bitrix", "label": "Битрикс24 — единый контур", "type": "system", "group": "Продажи"}, {"id": "demand", "label": "Первичный спрос", "type": "funnel", "group": "Продажи"}, {"id": "sale", "label": "Проектная продажа", "type": "funnel", "group": "Продажи"}, {"id": "execution", "label": "Производство и исполнение", "type": "funnel", "group": "Продажи"}, {"id": "tenderfunnel", "label": "Тендерная воронка", "type": "funnel", "group": "Продажи"}, {"id": "pipeline", "label": "Воронка 1000–2000 т", "type": "kpi", "group": "Продажи"}, {"id": "wins", "label": "Около 9 побед/мес", "type": "kpi", "group": "Продажи"}, {"id": "segments", "label": "Отраслевые сегменты", "type": "strategy", "group": "Продажи"}, {"id": "packages", "label": "4 продуктовых пакета", "type": "strategy", "group": "Продажи"}, {"id": "marketing", "label": "Маркетинг квалифицированных тонн", "type": "strategy", "group": "Маркетинг"}, {"id": "starbrand", "label": "STAR BUILDING — завод", "type": "brand", "group": "Маркетинг"}, {"id": "gcbrand", "label": "Grand Construction — под ключ", "type": "brand", "group": "Маркетинг"}, {"id": "cases", "label": "Кейсы и доказательства", "type": "content", "group": "Маркетинг"}, {"id": "education", "label": "Просвещение B2B/B2G", "type": "content", "group": "Маркетинг"}, {"id": "partners", "label": "Проектировщики и партнёры", "type": "channel", "group": "Маркетинг"}, {"id": "ai", "label": "ИИ-контур производства материалов", "type": "system", "group": "ИИ"}, {"id": "llm", "label": "ChatGPT / Claude", "type": "tool", "group": "ИИ"}, {"id": "visualai", "label": "Midjourney / Recraft / Firefly", "type": "tool", "group": "ИИ"}, {"id": "videoai", "label": "Whisper / CapCut / Runway / Kling / Veo", "type": "tool", "group": "ИИ"}, {"id": "automation", "label": "n8n / Make", "type": "tool", "group": "ИИ"}, {"id": "astana", "label": "Представительство в Астане", "type": "goal2027", "group": "2027"}, {"id": "b2g", "label": "ЛСТК в госбазах и тендерах", "type": "goal2027", "group": "2027"}, {"id": "techpack", "label": "Нормативно-технический пакет", "type": "action", "group": "2027"}, {"id": "pilot", "label": "Пилотный объект", "type": "action", "group": "2027"}, {"id": "dashboard", "label": "Панель тонн, маржи и сроков", "type": "control", "group": "Управление"}], "edges": [{"source": "annual", "target": "goal", "relation": "раскладывается в"}, {"source": "baseline", "target": "constraint", "relation": "показывает"}, {"source": "contracts", "target": "slots", "relation": "требует"}, {"source": "avgdeal", "target": "wins", "relation": "определяет"}, {"source": "cycle", "target": "pipeline", "relation": "определяет"}, {"source": "equipment", "target": "audit", "relation": "проверяется"}, {"source": "constraint", "target": "audit", "relation": "снимается через"}, {"source": "audit", "target": "ramp1", "relation": "запускает"}, {"source": "ramp1", "target": "ramp2", "relation": "после 90% плана"}, {"source": "ramp2", "target": "ramp3", "relation": "после 90% плана"}, {"source": "ramp3", "target": "ramp4", "relation": "после 90% плана"}, {"source": "ramp4", "target": "goal", "relation": "обеспечивает"}, {"source": "staffprod", "target": "ramp2", "relation": "обеспечивает"}, {"source": "wc", "target": "ramp4", "relation": "обеспечивает"}, {"source": "committee", "target": "slots", "relation": "утверждает"}, {"source": "committee", "target": "dashboard", "relation": "контролирует"}, {"source": "cco", "target": "committee", "relation": "руководит"}, {"source": "rop", "target": "bitrix", "relation": "обеспечивает дисциплину"}, {"source": "lead", "target": "sale", "relation": "ведёт A/B"}, {"source": "astana_coord", "target": "astana", "relation": "развивает"}, {"source": "tender", "target": "tenderfunnel", "relation": "ведёт"}, {"source": "newmgr", "target": "pipeline", "relation": "наращивает"}, {"source": "owner", "target": "sale", "relation": "подключается к ключевым"}, {"source": "bitrix", "target": "demand", "relation": "содержит"}, {"source": "bitrix", "target": "sale", "relation": "содержит"}, {"source": "bitrix", "target": "execution", "relation": "содержит"}, {"source": "bitrix", "target": "tenderfunnel", "relation": "содержит"}, {"source": "demand", "target": "sale", "relation": "передаёт"}, {"source": "sale", "target": "slots", "relation": "резервирует"}, {"source": "slots", "target": "execution", "relation": "запускает"}, {"source": "execution", "target": "goal", "relation": "исполняет"}, {"source": "pipeline", "target": "wins", "relation": "конвертируется"}, {"source": "wins", "target": "goal", "relation": "даёт"}, {"source": "segments", "target": "pipeline", "relation": "наполняют"}, {"source": "packages", "target": "sale", "relation": "усиливают"}, {"source": "marketing", "target": "pipeline", "relation": "создаёт"}, {"source": "starbrand", "target": "marketing", "relation": "позиционирует завод"}, {"source": "gcbrand", "target": "marketing", "relation": "позиционирует объект под ключ"}, {"source": "cases", "target": "marketing", "relation": "доказывают"}, {"source": "education", "target": "marketing", "relation": "формирует категорию"}, {"source": "partners", "target": "pipeline", "relation": "дают объекты"}, {"source": "ai", "target": "cases", "relation": "ускоряет"}, {"source": "llm", "target": "ai", "relation": "создаёт тексты"}, {"source": "visualai", "target": "ai", "relation": "создаёт графику"}, {"source": "videoai", "target": "ai", "relation": "создаёт видео"}, {"source": "automation", "target": "bitrix", "relation": "интегрирует"}, {"source": "pipeline", "target": "astana", "relation": "подтверждает рынок"}, {"source": "techpack", "target": "b2g", "relation": "открывает доступ"}, {"source": "pilot", "target": "techpack", "relation": "даёт доказательства"}, {"source": "tenderfunnel", "target": "b2g", "relation": "коммерциализирует"}, {"source": "dashboard", "target": "goal", "relation": "контролирует"}]}; const COLORS={"Цель": "#f59e0b", "Исходные данные": "#94a3b8", "Производство": "#ef4444", "Управление": "#8b5cf6", "Команда": "#3b82f6", "Продажи": "#06b6d4", "Маркетинг": "#22c55e", "ИИ": "#ec4899", "2027": "#f97316"}; const svg=document.getElementById('svg'),world=document.getElementById('world');
const W=1500,H=900,cx=W/2,cy=H/2; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const groups=[...new Set(DATA.nodes.map(n=>n.group))]; document.getElementById('stats').textContent=`${DATA.nodes.length} узлов · ${DATA.edges.length} связей`;
const sel=document.getElementById('group'); groups.forEach(g=>{let o=document.createElement('option');o.value=g;o.textContent=g;sel.appendChild(o)});
document.getElementById('legend').innerHTML=groups.map(g=>`<span style="background:${COLORS[g]}">${g}</span>`).join('');
const index=Object.fromEntries(DATA.nodes.map((n,i)=>[n.id,n]));
const buckets=Object.fromEntries(groups.map(g=>[g,DATA.nodes.filter(n=>n.group===g)]));
groups.forEach((g,gi)=>{const a=-Math.PI/2+gi*2*Math.PI/groups.length, bx=cx+Math.cos(a)*315,by=cy+Math.sin(a)*315; buckets[g].forEach((n,j)=>{const d=(j-(buckets[g].length-1)/2)*42; n.x=bx+Math.cos(a+Math.PI/2)*d;n.y=by+Math.sin(a+Math.PI/2)*d})}); index.goal.x=cx;index.goal.y=cy;
const NS='http://www.w3.org/2000/svg',eg=document.getElementById('edges'),ng=document.getElementById('nodes');
DATA.edges.forEach((e,i)=>{let a=index[e.source],b=index[e.target],l=document.createElementNS(NS,'line');l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);l.setAttribute('class','edge');l.dataset.i=i;eg.appendChild(l)});
function short(s){return s.length>24?s.slice(0,22)+'…':s}
DATA.nodes.forEach(n=>{let g=document.createElementNS(NS,'g');g.setAttribute('class','node');g.setAttribute('transform',`translate(${n.x},${n.y})`);g.dataset.id=n.id;let c=document.createElementNS(NS,'circle');c.setAttribute('r',n.id==='goal'?42:27);c.setAttribute('fill',COLORS[n.group]||'#94a3b8');let t=document.createElementNS(NS,'text');t.setAttribute('y',n.id==='goal'?3:4);t.textContent=short(n.label);g.append(c,t);g.onclick=()=>selectNode(n.id);ng.appendChild(g)});
function selectNode(id){document.querySelectorAll('.node').forEach(x=>x.classList.toggle('selected',x.dataset.id===id));document.querySelectorAll('.edge').forEach((x,i)=>{let e=DATA.edges[i];x.classList.toggle('active',e.source===id||e.target===id)});let n=index[id], rel=DATA.edges.filter(e=>e.source===id||e.target===id);document.getElementById('detail').innerHTML=`<h2>${n.label}</h2><span class="tag">${n.group}</span><span class="tag">${n.type}</span><p>${n.description||'Элемент единой стратегии.'}</p><h3>Связи</h3>${rel.map(e=>`<p><b>${e.source===id?'→':'←'} ${e.relation}</b><br>${index[e.source===id?e.target:e.source].label}</p>`).join('')}<hr style="border-color:#27445d"><div class="legend" id="legend2">${groups.map(g=>`<span style="background:${COLORS[g]}">${g}</span>`).join('')}</div>`}
function filter(){let q=document.getElementById('search').value.toLowerCase(),gr=sel.value;document.querySelectorAll('.node').forEach(x=>{let n=index[x.dataset.id],ok=(!gr||n.group===gr)&&(!q||n.label.toLowerCase().includes(q));x.style.opacity=ok?1:.08})}
document.getElementById('search').oninput=filter;sel.onchange=filter;document.getElementById('reset').onclick=()=>{document.getElementById('search').value='';sel.value='';filter();selectNode('goal')};
let scale=1,tx=0,ty=0,drag=false,px=0,py=0;function tr(){world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}svg.onwheel=e=>{e.preventDefault();scale=Math.max(.45,Math.min(2.4,scale*(e.deltaY<0?1.1:.9)));tr()};svg.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;tx+=(e.clientX-px)/scale;ty+=(e.clientY-py)/scale;px=e.clientX;py=e.clientY;tr()};svg.onpointerup=()=>drag=false;selectNode('goal');
</script></body></html>
